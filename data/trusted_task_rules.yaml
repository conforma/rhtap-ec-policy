rule_data:
  trusted_task_rules:
    # Note that the values of the keys under `deny:` and `allow:` are not
    # signficant. They are needed so trusted task rules from from different
    # sources can be merged together. For that reason they should be unique
    # enough to avoid clashing with the key used by trusted tasks from other
    # sources.

    allow:
      konflux-defaults:
        # The main Konflux build-definitions task catalog
        - pattern: oci://quay.io/konflux-ci/tekton-catalog/task-*

        # Konflux task catalogs for tasks not maintained in build-definitions
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-*
        - pattern: oci://quay.io/konflux-ci/konflux-vanguard/*

        # For RoK RPM builds
        # Note: This probably won't work right away since we don't yet support git resolved tasks
        # (In the longer term I think we should aim to build tekton bundles for these)
        - pattern: git+https://gitlab.cee.redhat.com/rhel-on-konflux/rpmbuild-pipeline.git//task/*

        # Found in quay.io/konflux-ci/ose-osc-tenant/data-acceptable-bundles
        # (Probably should be moved out of here and placed in the appropriate
        # ECP since I assume it's for one specific team.)
        - oci://quay.io/konflux-ci/ose-osc-tenant/build-dm-verity-image-task

    deny:
      konflux-defaults:
        # Source: konflux-ci/integration-service-catalog
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-clair-scan
          versions: ['<0.2']
          effective_on: "2026-08-03"
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-clamav-scan
          versions: ['<0.2']
          effective_on: "2026-08-03"
        - pattern: oci://quay.io/konflux-ci/integration-service-catalog/task-deprecated-image-check
          versions: ['<0.4']
          effective_on: "2026-07-04"
